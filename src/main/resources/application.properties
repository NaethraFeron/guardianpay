   spring.application.name=guardianpay
   server.port=8081

   spring.datasource.url=jdbc:h2:mem:guardianpay
   spring.datasource.username=sa
   spring.datasource.password=
   spring.jpa.hibernate.ddl-auto=update
   spring.jpa.show-sql=true
   spring.jpa.open-in-view=false
   spring.h2.console.enabled=true
   guardianpay.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploying-1234567890}
   guardianpay.jwt.expiration-minutes=60
   spring.web.error.include-message=always
   guardianpay.risk.large-amount=5000
   guardianpay.risk.most-of-balance-percent=80
   guardianpay.risk.rapid-count=3
   guardianpay.risk.rapid-window-minutes=10
   guardianpay.risk.approval-score=2
   guardianpay.risk.review-score=5
   guardianpay.transfer.hold-minutes=2
   guardianpay.transfer.guardian-deadline-minutes=3
   guardianpay.transfer.review-deadline-minutes=5
   guardianpay.admin.email=admin@guardianpay.com
   guardianpay.admin.password=${ADMIN_PASSWORD:Admin@12345}