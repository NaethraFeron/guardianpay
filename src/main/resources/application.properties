   spring.application.name=guardianpay
   server.port=8081

   spring.datasource.url=jdbc:h2:mem:guardianpay
   spring.datasource.username=sa
   spring.datasource.password=
   spring.jpa.hibernate.ddl-auto=update
   spring.jpa.show-sql=true
   spring.jpa.open-in-view=false
   spring.h2.console.enabled=true
   guardianpay.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploying-1234567890}
   guardianpay.jwt.expiration-minutes=60
   spring.web.error.include-message=always